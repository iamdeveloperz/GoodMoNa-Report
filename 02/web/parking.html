<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fafaf7">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 fill=%27%230e0e0e%27/%3E%3Crect x=%274%27 y=%2710%27 width=%278%27 height=%272%27 fill=%27%23d7261e%27/%3E%3C/svg%3E">
  <title>주차 — GoodMoNa</title>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <a class="wordmark" href="/intranet">GoodMoNa<span>인트라넷</span></a>
      <nav class="nav" id="nav" aria-label="화면"></nav>
      <span class="who" id="who"></span>
    </div>
  </header>
  <main class="page parking">
    <h1 class="page-title">주차</h1>
    <section class="block">
      <div class="section-head"><span class="index">01</span><h2>번호로 차주 찾기</h2><span class="grow"></span></div>
      <div id="lookup"></div>
    </section>
    <section class="block">
      <div class="section-head"><span class="index">02</span><h2>내 주차</h2><span class="grow"></span></div>
      <div id="mine"></div>
    </section>
    <section class="block">
      <div class="section-head"><span class="index">03</span><h2>내 차량</h2><span class="grow"></span></div>
      <div id="vehicles"></div>
    </section>
    <section class="block" data-roles="Owner,Admin" hidden>
      <div class="section-head"><span class="index">04</span><h2>배정 신청 대기</h2><span class="grow"></span><span class="meta" id="requestCount"></span></div>
      <div id="requests"></div>
    </section>
    <section class="block" data-roles="Owner,Admin" hidden>
      <div class="section-head"><span class="index">05</span><h2>주차면</h2><span class="grow"></span></div>
      <div id="spots"></div>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/src/parking/main.ts"></script>
</body>
</html>
