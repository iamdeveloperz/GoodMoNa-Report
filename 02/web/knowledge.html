<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fafaf7">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 fill=%27%230e0e0e%27/%3E%3Crect x=%274%27 y=%2710%27 width=%278%27 height=%272%27 fill=%27%23d7261e%27/%3E%3C/svg%3E">
  <title>자료 관리 — GoodMoNa</title>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <a class="wordmark" href="/intranet">GoodMoNa<span>인트라넷</span></a>
      <nav class="nav" id="nav" aria-label="화면"></nav>
      <span class="who" id="who"></span>
    </div>
  </header>
  <main class="page knowledge">
    <div class="row-between"><h1 class="page-title">자료 관리</h1><a class="textbtn" href="/intranet/ask">CS 도우미로</a></div>
    <div class="stats" id="stats"></div>
    <div id="editor"></div>
    <section class="block" id="questionsBox"><div class="section-head"><span class="index">01</span><h2>처리할 질문</h2><span class="grow"></span><span class="meta">답을 못 찾았거나 "부족함"을 누른 질문 → FAQ로 만들면 다음부터 찾습니다</span></div><div id="questions"></div></section>
    <section class="block"><div class="section-head"><span class="index">02</span><h2>승인 대기</h2><span class="grow"></span><span class="meta">승인해야 검색·AI 답변의 근거가 됩니다</span></div><div id="drafts"></div></section>
    <section class="block"><div class="section-head"><span class="index">03</span><h2>자료 가져오기</h2><span class="grow"></span><span class="meta">문서·FAQ·영상 대본을 붙여넣으면 규칙대로 잘라 초안으로 만듭니다</span></div>
      <form id="importForm" class="form-grid">
        <label class="field"><span class="label">정리한 방법</span><select name="origin"><option>직접</option><option>Claude</option><option>Codex</option><option>기타 AI</option></select></label>
        <label class="field"><span class="label">원본 이름</span><input type="text" name="name" maxlength="100" placeholder="진료안내.md"></label>
        <label class="field"><span class="label">기본 분류</span><input type="text" name="category" maxlength="20" placeholder="일반"></label>
        <label class="field"><span class="label">파일 (UTF-8 .md · .txt)</span><input type="file" id="file" accept=".md,.txt,text/plain,text/markdown"></label>
        <label class="field wide"><span class="label">내용</span><textarea name="text" rows="10" placeholder="# 진료 안내&#10;## 주차&#10;건물 지하 주차장 2시간 무료&#10;&#10;Q: 예약 변경은 어떻게 하나요?&#10;A: 전날 오후 6시까지 전화 주세요."></textarea></label>
        <div class="inline wide"><button class="btn" type="button" id="previewBtn">미리 보기</button><button class="btn primary" type="submit">초안으로 가져오기</button>
          <button class="textbtn" type="button" id="formatBtn">형식 · AI 정리 지시문 보기</button></div>
      </form>
      <div id="format" hidden></div>
      <div id="preview"></div>
    </section>
    <section class="block"><div class="section-head"><span class="index">04</span><h2>승인된 자료</h2><span class="grow"></span><input type="search" id="filter" placeholder="거르기" aria-label="자료 거르기"></div><div id="published"></div></section>
    <section class="block"><div class="section-head"><span class="index">05</span><h2>내린 · 반려한 자료</h2><span class="grow"></span></div><div id="others"></div></section>
    <section class="block"><div class="section-head"><span class="index">06</span><h2>가져오기 기록</h2><span class="grow"></span></div><div id="imports"></div></section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/src/knowledge/main.ts"></script>
</body>
</html>
